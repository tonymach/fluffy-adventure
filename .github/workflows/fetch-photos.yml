name: Fetch city photos

# Runs the media scraper on a GitHub-hosted runner (which HAS open internet,
# unlike the build sandbox), commits the photos back to the branch, AND deploys
# Pages itself. It must self-deploy because a push made with the built-in
# GITHUB_TOKEN does not trigger the separate deploy workflow (GitHub's
# loop-prevention rule). Trigger from the Actions tab or with a [fetch-photos]
# marker commit.

on:
  # Manual button in the Actions tab.
  workflow_dispatch:
    inputs:
      per_region:
        description: "Top N per region first (blank = all 120 towns)"
        required: false
        default: ""
      min_photos:
        description: "Minimum photos to accept per town"
        required: false
        default: "3"
      max_photos:
        description: "Maximum photos to download per town"
        required: false
        default: "8"
  # Also fires on any push whose commit message contains [fetch-photos], so it
  # can be kicked off with a marker commit. The CI's own commit-back is tagged
  # [skip-fetch] instead, so it never loops.
  push:
    branches:
      - claude/coastal-town-visual-tool-4wuxd5

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fetch-photos]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch photos (Openverse + Wikimedia, keyless)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MINP="${{ github.event.inputs.min_photos }}"; MINP="${MINP:-3}"
          MAXP="${{ github.event.inputs.max_photos }}"; MAXP="${MAXP:-8}"
          PR="${{ github.event.inputs.per_region }}"
          ARGS="--min-photos=$MINP --max-photos=$MAXP"
          [ -n "$PR" ] && ARGS="$ARGS --per-region=$PR"
          # a [force-photos] marker in the commit re-fetches even towns that
          # already have photos (used to replace low-relevance images)
          case "$COMMIT_MSG" in *"[force-photos]"*) ARGS="$ARGS --force";; esac
          echo "node scripts/fetch-media.mjs $ARGS"
          node scripts/fetch-media.mjs $ARGS

      - name: Summarize
        run: |
          echo "Towns with photos: $(ls -d images/*/ | while read d; do ls "$d"photo-* >/dev/null 2>&1 && echo x; done | wc -l) / 120"

      - name: Commit photos back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images credits media.js
          if git diff --cached --quiet; then
            echo "No new photos landed — nothing to commit."
          else
            git commit -m "Fetch city photos via CI [skip-fetch]"
            git push
            echo "Pushed photos."
          fi

      # Deploy Pages from here (the commit above can't trigger the deploy
      # workflow because it was pushed with GITHUB_TOKEN).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
